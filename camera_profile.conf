# GrainCapture camera profile
#
# These values are applied automatically before preview/capture.
# This is the current known-stable baseline, not final colour calibration.
# After you manually tune the camera to a better image, run:
#   ./save_camera_profile.sh /dev/video0
# to replace these values with the camera's current controls.

EXPOSURE=1
BRIGHTNESS=33000
GAIN=0
CONTRAST=2
SATURATION=2
GAMMA=0
WHITE_BALANCE_TEMPERATURE=0
SHARPNESS=3
BACKLIGHT_COMPENSATION=6
FRAME_RATE=30
